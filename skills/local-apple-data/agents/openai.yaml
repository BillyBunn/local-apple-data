interface:
  display_name: "Local Apple Data"
  short_description: "Local Apple data"
  brand_color: "#2F7D68"
  default_prompt: "Use $local-apple-data to search local Mail, Messages, inferred Hide My Email aliases, Voice Memos, Notes, Calendar, Contacts, Photos, Reminders, or iCloud Drive; retrieve exact content/detail only by opaque handle; and apply only approved Reminders, iCloud Drive create-text, Calendar create-event, or Contacts create-contact changes after a matching plan approval token."

dependencies:
  tools:
    - type: "mcp"
      value: "local-apple-data"
      description: "Local MCP server for Mail.app, Messages, inferred Hide My Email aliases, Voice Memos, Apple Notes, Apple Calendar, Apple Contacts, Apple Photos, Apple Reminders, and iCloud Drive metadata, with exact-handle content/detail retrieval and approved Reminders, iCloud Drive create-text, Calendar create-event, and Contacts create-contact apply."
      transport: "stdio"

policy:
  allow_implicit_invocation: true
