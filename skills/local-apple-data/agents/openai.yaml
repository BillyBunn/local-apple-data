interface:
  display_name: "Local Apple Data"
  short_description: "Local Apple data"
  brand_color: "#2F7D68"
  default_prompt: "Use $local-apple-data to search local Mail, Messages, inferred Hide My Email aliases, Voice Memos, Notes, Calendar, Contacts, Photos, Reminders, or iCloud Drive; retrieve/export exact content/detail only by opaque handle, including selected Mail and Notes attachments; and apply only approved Reminders, iCloud Drive create/append-text, Calendar create-event, Contacts create-contact, Notes create/append-text, Mail create-draft, or Photos import changes after a matching plan approval token."

dependencies:
  tools:
    - type: "mcp"
      value: "local-apple-data"
      description: "Local MCP server for Mail.app, Messages, inferred Hide My Email aliases, Voice Memos, Apple Notes, Apple Calendar, Apple Contacts, Apple Photos, Apple Reminders, and iCloud Drive metadata, with exact-handle content/detail/export retrieval including selected Mail and Notes attachments and approved Reminders, iCloud Drive create/append-text, Calendar create-event, Contacts create-contact, Notes create/append-text, Mail create-draft, and Photos import apply."
      transport: "stdio"

policy:
  allow_implicit_invocation: true
