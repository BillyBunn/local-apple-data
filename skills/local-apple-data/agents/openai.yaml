interface:
  display_name: "Local Apple Data"
  short_description: "Local Apple data"
  brand_color: "#2F7D68"
  default_prompt: "Use $local-apple-data for a metadata-first local Apple-data task. Retrieve content or detail only from an exact opaque handle, and perform mutations only through the documented plan, matching approval token, and explicit-confirmation gate."

dependencies:
  tools:
    - type: "mcp"
      value: "local-apple-data"
      description: "Private local MCP server for metadata-first Apple Mail, Messages, aliases, Voice Memos, Safari, Shortcuts, Books, Podcasts, Music, TV, Freeform, Notes, Calendar, Contacts, Photos, Reminders, iCloud Drive, and bounded home-filesystem workflows. Full content/detail/export requires exact opaque handles. Mutations remain limited to the server's documented plan, approval-token, explicit-confirmation, and read-back gates."
      transport: "stdio"

policy:
  allow_implicit_invocation: true
