name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Run tests
        run: uv run pytest

      - name: Compile Python
        run: uv run python -m compileall src tests scripts

      - name: Typecheck Swift helpers
        run: |
          swiftc -typecheck scripts/eventkit_helper.swift
          swiftc -typecheck scripts/contacts_helper.swift
          swiftc -typecheck scripts/photos_helper.swift

      - name: Runtime smoke
        run: uv run python scripts/verify_runtime.py

      - name: Render MCP client configs
        run: |
          uv run python scripts/render_mcp_client_config.py --client generic
          uv run python scripts/render_mcp_client_config.py --client claude-code
          uv run python scripts/render_mcp_client_config.py --client cursor
          uv run python scripts/render_mcp_client_config.py --client openclaw --server-only --compact

      - name: Redaction scan
        run: uv run python scripts/redaction_scan.py .

      - name: Public release scan
        run: uv run python scripts/public_release_scan.py

      - name: Mutation gate audit
        run: uv run python scripts/audit_mutation_gates.py

      - name: Surface contract audit
        run: uv run python scripts/audit_surface_contract.py

      - name: Audit release readiness
        run: uv run python scripts/audit_release_readiness.py --json

      - name: Generate release receipt
        run: uv run python scripts/generate_release_receipt.py --json

      - name: Build public release tree
        run: uv run python scripts/build_public_release_tree.py --dest "$RUNNER_TEMP/local-apple-data-public" --force

      - name: Test public release tree
        working-directory: ${{ runner.temp }}/local-apple-data-public
        run: |
          uv run pytest
          uv run python -m compileall src tests scripts
          uv run python scripts/redaction_scan.py .
          uv run python scripts/public_release_scan.py
          uv run python scripts/audit_mutation_gates.py
          uv run python scripts/audit_surface_contract.py
          uv run python scripts/generate_release_receipt.py --json
          uv run python scripts/verify_runtime.py

      - name: Prepare public git checkout
        run: uv run python scripts/prepare_public_git_checkout.py --dest "$RUNNER_TEMP/local-apple-data-public-git" --force --init-git --commit --json
