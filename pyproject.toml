[project]
name = "local-apple-data"
version = "0.1.0"
description = "Local-first Apple data CLI and MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Billy Bunn" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  # Upper bound is deliberate. mcp 2.0.0 (2026-07-28) removed `mcp.server.fastmcp`, which
  # `local_apple_data.mcp_server` imports directly. An unpinned `mcp>=1.0` resolves to 2.x
  # today and the server dies at import with ModuleNotFoundError. Keep `<2` until the
  # FastMCP usage is ported to the 2.x `mcp.server.mcpserver` API.
  "mcp>=1.0,<2",
]

[project.scripts]
local-apple-data = "local_apple_data.cli:main"
local-apple-data-mcp = "local_apple_data.mcp_server:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
